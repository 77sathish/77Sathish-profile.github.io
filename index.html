<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathish Kanthi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-blue: #E4EEF5;
      --heading-rust: #B5623A;
      --subtitle-ink: #3A3A38;
      --near-black: #1B1B19;
      --card-bg: #FFFFFF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-blue);
      color: var(--near-black);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 20px;
    }
    .wrap {
      position: relative;
      max-width: 520px;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2.5px solid var(--heading-rust);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Lora", serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--near-black);
    }
    h1 {
      font-family: "Lora", serif;
      font-weight: 700;
      font-size: 2.6rem;
      letter-spacing: -0.01em;
      color: var(--heading-rust);
      margin: 0 0 10px;
    }
    p {
      font-family: "Lora", serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--subtitle-ink);
      margin: 0 0 6px;
    }
    .status {
      font-family: "Inter", sans-serif;
      font-style: normal;
      font-size: 0.85rem;
      color: #888;
      margin-top: 18px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-badge">SK</div>
    <h1>Sathish Kanthi</h1>
    <p>AI Engineer · Generative AI, RAG &amp; Agentic AI Applications</p>
    <div class="status">Building something here — check back soon.</div>
  </div>
</body>
</html>
